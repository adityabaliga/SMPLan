<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SMPL MRP - Maintenance History</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-alpha.6/css/bootstrap.min.css" integrity="sha384-rwoIResjU2yc3z8GV/NPeZWAv56rSmLldC3R/AZzGRnGxQQKnKkoFVhFQhNUwEyJ" crossorigin="anonymous">
<style>
        hr.style1{
	        border-top: 15px solid #4d0000;
            }
        .oe{
            font-family: Mathematica6 Bold, Old English Text MT, Engravers Old English BT, Old English, Collins Old English, New Old English, serif;
            font-size: 50px;
            color: #4d0000;
            text-align:center;
            }
        .topnav a:hover {
            color: #4d0000;
            text-decoration: none;
        }
        .nopad {
                margin: 0;
                padding: 0;
                margin-top: 0em;
                margin-bottom: 0em;
            }
    </style>

</head>
<form method="POST" action="/maintenance_entry_submit">
    <div class="topnav" id="myTopnav">
        <br>
        <table>
            <td><img src="/static/logo.jpg"  height="70" width="92" align = "left"></td>
            <td width="1050px"><div align="center" class="nopad"> <a href="\main_menu"  class="oe">SMPL</a></div></td>
            <td><div align="left" class="nopad">Hi {{current_user.username}}<br>
            <a href="\change_password_form">Change Password</a><br>
            <a href="\logout">Logout</a></div></td>
        </table>
    </div>
    <hr class ="style1">

    <table class= 'table table-sm'>
        <tr>

            <th>Machine</th>
            <th>Part</th>
            <th>Start Date</th>
            <th>Start Time</th>
            <th>End Date</th>
            <th>End Time</th>

            <th>Description</th>
            <th>Repair Done By</th>
            <th>Entry By</th>

        </tr>
        {% for rec in user_data %}
        <tr>

            <td>{{rec[1]}}</td>
            <td>{{rec[2]}}</td>
            <td>{{rec[0]}}</td>


            <td>{{rec[4]}}</td>
            <td>{{rec[9]}}</td>
            <td>{{rec[5]}}</td>
            <td>{{rec[6]}}</td>
            <td>{{rec[3]}}</td>
            <td>{{rec[7]}}</td>
            <td>{{rec[10]}}</td>

        </tr>
        {% endfor %}

    </table>



</form>
</html>
